async function liveRates(){
  var d=null,now=Date.now(),errs=[];
  try{var c=JSON.parse(localStorage.getItem("fxlive2")||"null");if(c&&c.iso&&now-c.t<3600000)d=c}catch(x){}
  for(var i=0;i<FXSRC.length&&!d;i++){
    try{var r=await fetch(FXSRC[i].u);if(!r.ok)throw new Error("HTTP "+r.status);var o=FXSRC[i].p(await r.json());d={t:now,rates:o.rates,iso:o.iso,n:FXSRC[i].n};try{localStorage.setItem("fxlive2",JSON.stringify(d))}catch(x){}}
    catch(x){errs.push((x&&x.message)||"error")}
  }
  if(d){
    var n=0;Object.keys(TASAS).forEach(function(k){var v=d.rates[k];if(v>0){TASAS[k]={r:v,f:d.iso};n++;var a=$("tr_"+k),b=$("tf_"+k);if(a)a.value=v;if(b)b.value=d.iso}});
    if(n){FXD=d.iso.split("-").reverse().join("/");FXN=d.n;FXS=1}else{FXS=2;FXE="sin datos"}
  }else{FXS=2;FXE=errs[0]||"sin conexión"}
  fill();
}
applyLang("es");fill();liveRates();
