<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hub ESDESIGN</title>
<style>
:root{--ac:#e8762d;--bg:#f6f5f2;--bd:#ddd9d2;--tx:#1a1a1a;--mut:#6b6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Arial,Helvetica,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px}
.logo{font-size:30px;font-weight:700;letter-spacing:.5px}.logo b{color:var(--ac)}
.logo small{display:block;font-size:10px;font-weight:400;color:var(--mut);letter-spacing:1px}
h1{font-size:15px;margin:28px 0 12px;padding:8px 12px;background:#111;color:#fff;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
a.card{display:block;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:16px;color:inherit;text-decoration:none;border-top:4px solid var(--ac)}
a.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.12)}
a.card b{display:block;margin-bottom:4px}a.card span{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><b>ES</b> DESIGN<small>HUB DE HERRAMIENTAS INTERNAS</small></div>
  <h1>Admisiones</h1>
  <div class="grid">
    <a class="card" href="admisiones/propuesta-economica.html"><b>Propuesta económica</b><span>Calculadora de condiciones económicas con descuentos, formas de pago y PDF para el candidato.</span></a>
  </div>
  <!-- Para añadir una herramienta: subir su archivo .html a una carpeta y copiar el bloque <a class="card"> de arriba -->
</div>
</body>
</html>
